name: SonarQube Cloud

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube analysis
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: xcode-27
    timeout-minutes: 15

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate with SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@v1
        with:
          project-key: pablo-ziura_TuneQuest
          export-env: false

      - name: Analyze code and check quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
